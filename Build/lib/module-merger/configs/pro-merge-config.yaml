# 专业版模块合并配置文件

# 基本信息
name: "All-in-One Pro Ad Blocker"
version: "2.x"
description: "Professional Ad-free Experience with comprehensive module coverage"
category: "🛡️ MirrRule Pro"
author: "@lucking7"

# 要合并的模块列表
#
# 字段说明:
#   url:              模块文件路径（支持 file:// 本地路径或 http(s):// 远程地址）
#   header:           模块显示名称（用于分隔符和参数说明）
#   id:               必填且唯一，字母开头，只含字母、数字和下划线。整模块开关参数名为 <id>
#                     （默认开启，填 # 注释该模块在 Rule、URL Rewrite、Header Rewrite、Body Rewrite、
#                     Map Local、Script 中的所有行），也是命令行 --only/--enable/--disable 的取值
#   defaultOff:       整模块开关默认填 #（停用），用户在 Surge 中清空即启用；不写时默认启用
#
modules:
  # HTTPDNS拦截器（基础过滤）
  - url: "file://public/Modules/Converted/HTTPDNS拦截器.sgmodule"
    header: "HTTPDNS拦截器"
    id: httpdns

