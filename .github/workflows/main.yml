name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # 🌟 完整构建 - 每天 2 次 (05:00, 17:00 UTC)
    # 执行: 镜像同步 + 插件转换 + 模块合并 + 规则构建 + 部署
    - cron: '0 5,17 * * *'

    # ⚡ 快速更新 - 每 4 小时 (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # 执行: 规则构建 + 部署 (智能增量,不覆盖其他目录)
    - cron: '0 */4 * * *'

    # 🪞 镜像同步 - 每天 3 次 (06:00, 14:00, 22:00 UTC)
    # 执行: 镜像同步 + 规则构建 + 部署 (智能增量)
    - cron: '0 6,14,22 * * *'

    # 🔌 插件转换 - 每天 2 次 (07:30, 19:30 UTC)
    # 执行: 插件转换 + 模块合并 + 规则构建 + 部署 (智能增量)
    - cron: '30 7,19 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '执行任务 (all/build/convert-plugins/merge-modules/mirror-sync/deploy/bootstrap-baseline/rollback)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - build
          - convert-plugins
          - merge-modules
          - mirror-sync
          - deploy
          - bootstrap-baseline
          - rollback
      deploy_target:
        description: '发布目标；唯一生产入口是 NRRule Git integration。all/github/cloudflare 为兼容旧值，均按 production 处理'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - all
          - github
          - cloudflare
      bootstrap_revision:
        description: 'bootstrap-baseline：固定的 NRRule commit（40 位 SHA）'
        required: false
        default: ''
        type: string
      bootstrap_immutable_url:
        description: 'bootstrap-baseline：该 commit 的 Cloudflare immutable URL（https://<hex>.nrrule.pages.dev）'
        required: false
        default: ''
        type: string
      rollback_receipt_id:
        description: 'rollback：要恢复的已验收 receipt（MirrRule deployment id）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# 只有 pull request 取消旧 run；生产相关 run 排队，不中断已 push 的验收。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================
  # 准备阶段：确定需要执行的任务
  # ============================================
  prepare:
    name: Prepare Tasks
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.decide.outputs.tasks }}
      deploy_target: ${{ steps.decide.outputs.deploy_target }}
    steps:
      - name: Decide tasks to run
        id: decide
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            TASK="all"
          fi

          EVENT_NAME="${{ github.event_name }}"
          CRON="${{ github.event.schedule }}"

          DEPLOY_TARGET="${{ github.event.inputs.deploy_target }}"
          case "$DEPLOY_TARGET" in
            ""|production)
              DEPLOY_TARGET="production"
              ;;
            all|github|cloudflare)
              echo "::notice::deploy_target=$DEPLOY_TARGET is a legacy selector and is normalized to production. Production is published only through the NRRule Git integration and accepted after Cloudflare and production content verification; 'github' no longer means repository-only."
              DEPLOY_TARGET="production"
              ;;
            *)
              echo "::error::Unknown deploy_target: $DEPLOY_TARGET" >&2
              exit 1
              ;;
          esac

          FULL_TASKS='["convert-plugins","merge-modules","mirror-sync","build","deploy"]'
          TASKS='[]'
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$TASK" in
                all)
                  TASKS="$FULL_TASKS"
                  ;;
                build)
                  TASKS='["build"]'
                  ;;
                convert-plugins)
                  TASKS='["convert-plugins"]'
                  ;;
                merge-modules)
                  TASKS='["merge-modules"]'
                  ;;
                mirror-sync)
                  # 镜像同步在 Build job 内执行，因此同一 run 必须同时构建产物。
                  TASKS='["mirror-sync","build"]'
                  ;;
                deploy)
                  # 部署 job 只接受本次 run 的已验收 artifact，先构建再部署。
                  TASKS='["build","deploy"]'
                  ;;
                bootstrap-baseline)
                  # 只核验固定的旧版 NRRule revision 并写入 legacy-bootstrap receipt，不发布。
                  TASKS='["bootstrap-baseline"]'
                  ;;
                rollback)
                  # 以已验收 receipt 的 tree 为候选，应用当前退休登记后经同一链路发布。
                  TASKS='["rollback"]'
                  ;;
              esac
              ;;
            push)
              TASKS="$FULL_TASKS"
              ;;
            pull_request)
              TASKS='["build"]'
              ;;
            schedule)
              case "$CRON" in
                "0 5,17 * * *")
                  TASKS="$FULL_TASKS"
                  ;;
                "0 */4 * * *")
                  TASKS='["build","deploy"]'
                  ;;
                "0 6,14,22 * * *")
                  TASKS='["mirror-sync","build","deploy"]'
                  ;;
                "30 7,19 * * *")
                  TASKS='["convert-plugins","merge-modules","build","deploy"]'
                  ;;
              esac
              ;;
          esac

          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$DEPLOY_TARGET" >> "$GITHUB_OUTPUT"

          echo "📋 Trigger Information:"
          echo "  Event: $EVENT_NAME"
          echo "  Task: $TASK"
          echo "  Cron: $CRON"
          echo ""
          echo "📋 Tasks to run: $TASKS"
          echo "  Deploy target: $DEPLOY_TARGET"

  # ============================================
  # 已验收基线：最近一个 success receipt，不使用 NRRule HEAD
  # ============================================
  baseline:
    name: Resolve Accepted Baseline
    needs: prepare
    if: |
      needs.prepare.outputs.tasks != '[]' &&
      !contains(fromJSON(needs.prepare.outputs.tasks), 'bootstrap-baseline')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      available: ${{ steps.select.outputs.available }}
      receipt_id: ${{ steps.select.outputs.receipt_id }}
      deploy_commit: ${{ steps.select.outputs.deploy_commit }}
      kind: ${{ steps.select.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Select accepted receipt
        id: select
        run: pnpm run node Build/prepare-publication.ts select-baseline --allow-missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 插件转换任务 - 只有需要插件转换时才启动 Script-Hub
  # ============================================
  convert-plugins:
    name: Convert Plugins
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.tasks), 'convert-plugins')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - name: Install browser gateway dependencies
        run: python3 -m pip install --requirement Build/browser-rule-requirements.txt

      - name: Run browser gateway tests
        run: python3 Build/__tests__/browser-rule-gateway.test.py

      - name: Setup plugin output directories
        run: mkdir -p public/Modules/Converted public/Scripts

      - name: Start browser rule gateway
        run: |
          set -euo pipefail
          gateway_log="$RUNNER_TEMP/browser-rule-gateway.log"
          gateway_pid="$RUNNER_TEMP/browser-rule-gateway.pid"
          nohup python3 Build/browser-rule-gateway.py \
            --upstream-base https://cloudflare-proxy.lucking.workers.dev \
            --port 13193 >"$gateway_log" 2>&1 &
          gateway_pid_value=$!
          printf '%s\n' "$gateway_pid_value" > "$gateway_pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:13193/health >/dev/null; then
              echo "✅ Browser rule gateway ready (attempt $attempt/30)"
              exit 0
            fi
            if ! kill -0 "$gateway_pid_value" 2>/dev/null; then
              echo "❌ Browser rule gateway exited during startup" >&2
              cat "$gateway_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "❌ Browser rule gateway startup timed out" >&2
          cat "$gateway_log" >&2 || true
          exit 1

      - name: Configure Script-Hub
        run: |
          set -euo pipefail
          echo "127.0.0.1 script.hub" | sudo tee -a /etc/hosts
          docker create \
            --name mirrrule-script-hub \
            --network host \
            xream/script-hub@sha256:4e9e5055157d2d85f9c03abd045a0016fe594adc44d27410019cdb4818961f45
          docker cp mirrrule-script-hub:/app/Rewrite-Parser.beta.js "$RUNNER_TEMP/script-hub-original.js"
          pnpm run node Build/patch-script-hub.ts \
            "$RUNNER_TEMP/script-hub-original.js" "$RUNNER_TEMP/script-hub-patched.js"
          docker cp "$RUNNER_TEMP/script-hub-patched.js" mirrrule-script-hub:/app/Rewrite-Parser.beta.js
          docker start mirrrule-script-hub
          echo "⏳ 等待 Script-Hub 服务启动..."
          for i in {1..30}; do
            if curl --fail --silent --max-time 2 http://script.hub:9101/ > /dev/null 2>&1; then
              echo "✓ Script-Hub 服务就绪 (尝试 $i/30)"
              sleep 10
              exit 0
            fi
            echo "  尝试 $i/30 失败，等待 5 秒后重试..."
            sleep 5
          done
          echo "❌ Script-Hub 服务启动超时"
          exit 1

      - name: Convert plugins
        run: |
          set -euo pipefail
          last_status=1
          for attempt in 1 2; do
            if pnpm run convert-plugins --wait-service \
              --required-config Build/lib/module-merger/configs/pro-merge-config.yaml; then
              exit 0
            else
              last_status=$?
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "⚠️ 首次转换失败，等待 10 秒后重试..."
              sleep 10
            fi
          done
          echo "❌ 两次转换都失败" >&2
          exit "$last_status"
        env:
          CI: true
          PROXY_BASE: http://127.0.0.1:13193?url=
          PLUGIN_CONVERSION_REPORT: ${{ runner.temp }}/plugin-conversion-report.json

      - name: Verify converted outputs
        run: |
          set -euo pipefail
          converted_count=$(find public/Modules/Converted -type f -name '*.sgmodule' -size +0c | wc -l)
          if [ "$converted_count" -eq 0 ]; then
            echo "❌ Plugin conversion produced no non-empty .sgmodule files" >&2
            exit 1
          fi
          echo "✅ Plugin conversion produced $converted_count non-empty .sgmodule files"

      - name: Upload plugin conversion output
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-output-${{ github.sha }}-${{ github.run_number }}
          path: |
            public/Modules/Converted
            public/Scripts
          retention-days: 1
          compression-level: 4
          if-no-files-found: error

      - name: Upload plugin conversion report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-conversion-report-${{ github.sha }}-${{ github.run_number }}
          path: ${{ runner.temp }}/plugin-conversion-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop plugin conversion services
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/browser-rule-gateway.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi
          docker rm --force mirrrule-script-hub 2>/dev/null || true

      - name: Upload browser gateway log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-browser-rule-gateway-log-${{ github.sha }}-${{ github.run_number }}
          path: ${{ runner.temp }}/browser-rule-gateway.log
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # 模块合并任务 - 不需要 Script-Hub 服务
  # ============================================
  merge-modules:
    name: Merge Modules
    needs: [prepare, baseline, convert-plugins]
    if: |
      always() &&
      contains(fromJSON(needs.prepare.outputs.tasks), 'merge-modules') &&
      needs.baseline.result == 'success' &&
      (needs.convert-plugins.result == 'success' || needs.convert-plugins.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Setup module output directories
        run: mkdir -p public/Modules/Converted public/Modules/Merged public/Modules/Rules public/Scripts

      - name: Check out accepted baseline tree
        if: needs.baseline.outputs.available == 'true'
        run: |
          pnpm run node Build/prepare-publication.ts resolve-baseline \
            --receipt-id "$RECEIPT_ID" \
            --tree "$RUNNER_TEMP/publication-baseline" \
            --evidence "$RUNNER_TEMP/publication-baseline.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECEIPT_ID: ${{ needs.baseline.outputs.receipt_id }}

      - name: Download plugin conversion output
        if: contains(fromJSON(needs.prepare.outputs.tasks), 'convert-plugins')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-output-${{ github.sha }}-${{ github.run_number }}
          path: public

      - name: Ensure converted modules exist
        run: |
          set -euo pipefail
          CONVERTED_DIR="public/Modules/Converted"
          if [ -d "$CONVERTED_DIR" ]; then
            FILE_COUNT=$(find "$CONVERTED_DIR" -type f -name '*.sgmodule' 2>/dev/null | wc -l)
          else
            FILE_COUNT=0
          fi

          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "✅ 已有 $FILE_COUNT 个转换后的模块文件，无需下载"
            exit 0
          fi

          CONVERSION_REQUESTED="${{ contains(fromJSON(needs.prepare.outputs.tasks), 'convert-plugins') }}"
          if [ "$CONVERSION_REQUESTED" = "true" ]; then
            echo "❌ Plugin conversion was requested, but its artifact contains no converted modules" >&2
            exit 1
          fi

          echo "📥 No conversion was requested; copying existing converted modules from the accepted baseline..."
          BASELINE_CONVERTED="$RUNNER_TEMP/publication-baseline/Modules/Converted"
          if [ "$BASELINE_AVAILABLE" != "true" ] || [ ! -d "$BASELINE_CONVERTED" ]; then
            echo "❌ Existing converted modules are unavailable: no accepted baseline tree (run bootstrap-baseline first)" >&2
            exit 1
          fi
          mkdir -p "$CONVERTED_DIR"
          cp -R "$BASELINE_CONVERTED/." "$CONVERTED_DIR/"
          pnpm run node Build/prepare-publication.ts purge --root public

          FILE_COUNT=$(find "$CONVERTED_DIR" -type f -name '*.sgmodule' 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ Existing converted modules are unavailable" >&2
            exit 1
          fi
          echo "✅ Copied $FILE_COUNT existing converted modules from accepted ${{ needs.baseline.outputs.deploy_commit }}"
        env:
          BASELINE_AVAILABLE: ${{ needs.baseline.outputs.available }}

      - name: Merge modules
        run: |
          mkdir -p public/Modules/Rules
          pnpm run node ./Build/merge-modules.ts --config Build/lib/module-merger/configs/pro-merge-config.yaml
        env:
          CI: true

      - name: Preserve previous optional modules and scripts
        if: |
          contains(fromJSON(needs.prepare.outputs.tasks), 'convert-plugins') &&
          needs.baseline.outputs.available == 'true'
        run: |
          set -euo pipefail
          previous_root="$RUNNER_TEMP/publication-baseline"
          from_commit=$(git -C "$previous_root" rev-parse HEAD)
          if [ "$from_commit" != "$DEPLOY_COMMIT" ]; then
            echo "❌ Baseline tree is at $from_commit, expected accepted $DEPLOY_COMMIT" >&2
            exit 1
          fi
          echo "Previous artifact commit (accepted receipt $RECEIPT_ID): $from_commit"
          pnpm run node Build/restore-optional-artifacts.ts \
            Build/lib/module-merger/configs/pro-merge-config.yaml "$previous_root" \
            --from-commit "$from_commit"
        env:
          DEPLOY_COMMIT: ${{ needs.baseline.outputs.deploy_commit }}
          RECEIPT_ID: ${{ needs.baseline.outputs.receipt_id }}

      - name: Report skipped optional restoration
        if: |
          contains(fromJSON(needs.prepare.outputs.tasks), 'convert-plugins') &&
          needs.baseline.outputs.available != 'true'
        run: echo "::notice::No accepted baseline receipt; previous optional modules and scripts are not restored. This build cannot be published until the bootstrap-baseline task has run."

      - name: Upload module output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-output-${{ github.sha }}-${{ github.run_number }}
          path: |
            public/Modules
            public/Scripts
            public/Internal/preserved-artifacts.json
          retention-days: 1
          compression-level: 4
          if-no-files-found: warn

  # ============================================
  # 核心构建任务 - 包含规则生成与最终产物
  # ============================================
  build:
    name: Build
    needs: [prepare, baseline, convert-plugins, merge-modules]
    if: |
      always() &&
      contains(fromJSON(needs.prepare.outputs.tasks), 'build') &&
      needs.baseline.result == 'success' &&
      (needs.convert-plugins.result == 'success' || needs.convert-plugins.result == 'skipped') &&
      (needs.merge-modules.result == 'success' || needs.merge-modules.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      # 🚀 网络性能优化
      - uses: smorimoto/tune-github-hosted-runner-network@bb252dcb5c8609a31087e7993daa086f5a1c0069 # v1.0.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install browser gateway dependencies
        run: python3 -m pip install --requirement Build/browser-rule-requirements.txt

      - name: Run browser gateway tests
        run: python3 Build/__tests__/browser-rule-gateway.test.py

      - name: Start browser rule gateway
        run: |
          set -euo pipefail
          gateway_log="$RUNNER_TEMP/browser-rule-gateway.log"
          gateway_pid="$RUNNER_TEMP/browser-rule-gateway.pid"
          nohup python3 Build/browser-rule-gateway.py \
            --upstream-base https://cloudflare-proxy.lucking.workers.dev \
            --port 13193 >"$gateway_log" 2>&1 &
          gateway_pid_value=$!
          printf '%s\n' "$gateway_pid_value" > "$gateway_pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:13193/health >/dev/null; then
              echo "✅ Browser rule gateway ready (attempt $attempt/30)"
              exit 0
            fi
            if ! kill -0 "$gateway_pid_value" 2>/dev/null; then
              echo "❌ Browser rule gateway exited during startup" >&2
              cat "$gateway_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "❌ Browser rule gateway startup timed out" >&2
          cat "$gateway_log" >&2 || true
          exit 1

      - name: Setup build directory
        id: build-dir
        run: |
          echo "dir=public" >> $GITHUB_OUTPUT
          mkdir -p public

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "year=$(date +'%Y')" >> $GITHUB_OUTPUT
          echo "month=$(date +'%m')" >> $GITHUB_OUTPUT
          echo "day=$(date +'%d')" >> $GITHUB_OUTPUT

      # 缓存策略：
      # - 主键包含 run_id，确保每次运行有唯一缓存，避免并发冲突
      # - restore-keys 按时间粒度降级：同日 > 同月 > 同年 > 任意
      # - 这样既避免了 "another job may be creating this cache" 错误
      # - 又能最大化利用最近的缓存数据
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-build-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }}-
            ${{ runner.os }}-build-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-
            ${{ runner.os }}-build-v3-${{ steps.date.outputs.year }}-
            ${{ runner.os }}-build-v3-

      - run: pnpm install --frozen-lockfile

      - name: Validate code quality
        run: pnpm run validate

      - name: Run regression tests
        run: pnpm test

      - name: Check unused code and dependencies
        run: pnpm run knip

      # 🔧 步骤 1: 镜像同步（如果需要）
      - name: Sync mirrors (iRingo, DualSubs, BiliUniverse)
        if: contains(fromJSON(needs.prepare.outputs.tasks), 'mirror-sync')
        run: pnpm run node ./Build/sync-mirrors.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true

      - name: Download Sukka mock & sgmodule
        if: contains(fromJSON(needs.prepare.outputs.tasks), 'mirror-sync')
        run: pnpm run node ./Build/download-mock-modules.ts
        env:
          CI: true

      - name: Download fmz200 Split Modules
        if: contains(fromJSON(needs.prepare.outputs.tasks), 'mirror-sync')
        run: pnpm run node ./Build/download-fmz200-split.ts
        env:
          CI: true

      - name: Download plugin conversion output
        if: |
          !contains(fromJSON(needs.prepare.outputs.tasks), 'merge-modules') &&
          needs.convert-plugins.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-output-${{ github.sha }}-${{ github.run_number }}
          path: public

      - name: Download module output
        if: needs.merge-modules.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-output-${{ github.sha }}-${{ github.run_number }}
          path: public

      # 🔧 步骤 4.2: 清理 Modules 根目录中的历史 .sgmodule 文件
      - name: Clean legacy Modules root files
        run: |
          echo "🧹 清理 public/Modules 根目录中的历史 .sgmodule 文件..."
          if [ -d "public/Modules" ]; then
            LEGACY_COUNT=$(find public/Modules -maxdepth 1 -type f -name '*.sgmodule' 2>/dev/null | wc -l)
            if [ "$LEGACY_COUNT" -gt 0 ]; then
              echo "  🗑️  将删除 $LEGACY_COUNT 个旧的根目录 .sgmodule 文件"
              find public/Modules -maxdepth 1 -type f -name '*.sgmodule' -print -delete
            else
              echo "  ✅ 没有需要清理的根目录 .sgmodule 文件"
            fi
          fi
          # 确保新目录结构存在
          mkdir -p public/Modules/Converted public/Modules/Merged public/Modules/Rules

      # 🔧 步骤 4.5: 未在本次刷新的 Mirror/Modules/Scripts 取自已验收基线，而非 NRRule HEAD
      - name: Check out accepted baseline tree
        id: baseline-tree
        if: needs.baseline.outputs.available == 'true'
        run: |
          pnpm run node Build/prepare-publication.ts resolve-baseline \
            --receipt-id "$RECEIPT_ID" \
            --tree "$RUNNER_TEMP/publication-baseline" \
            --evidence "$RUNNER_TEMP/publication-baseline.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECEIPT_ID: ${{ needs.baseline.outputs.receipt_id }}

      - name: Restore preserved directories from accepted baseline
        run: |
          set -euo pipefail
          if [ "$BASELINE_AVAILABLE" != "true" ]; then
            echo "::warning::No accepted baseline receipt; directories not refreshed by this run are absent from this build artifact. Production publication requires an accepted baseline (run bootstrap-baseline)."
            exit 0
          fi
          pnpm run node Build/prepare-publication.ts restore-preserved \
            --public public \
            --tasks "$TASKS" \
            --tree "$RUNNER_TEMP/publication-baseline" \
            --evidence "$RUNNER_TEMP/publication-baseline.json"
        env:
          BASELINE_AVAILABLE: ${{ needs.baseline.outputs.available }}
          TASKS: ${{ needs.prepare.outputs.tasks }}

      # 🔧 步骤 5: 规则构建（始终执行）
      - run: pnpm run build
        env:
          PUBLIC_DIR: ${{ steps.build-dir.outputs.dir }}
          PROXY_BASE: http://127.0.0.1:13193?url=
          PUBLICATION_BASELINE_DIR: ${{ steps.baseline-tree.outcome == 'success' && format('{0}/publication-baseline', runner.temp) || '' }}
          PUBLICATION_BASELINE_RECEIPT_ID: ${{ needs.baseline.outputs.receipt_id }}

      - name: Verify build output
        run: |
          if [ ! -d "${{ steps.build-dir.outputs.dir }}" ]; then
            echo "❌ Build directory not found"
            exit 1
          fi
          if [ ! "$(ls -A ${{ steps.build-dir.outputs.dir }})" ]; then
            echo "❌ Build directory is empty"
            exit 1
          fi
          if [ ! -f ".BUILD_FINISHED" ]; then
            echo "❌ Build finished marker not found"
            exit 1
          fi

          echo "📊 Build output statistics:"
          echo ""
          echo "📁 目录结构:"
          # 显示第一层目录结构
          ls -la public/ | head -20
          echo ""

          echo "📈 文件统计:"
          # 规则文件
          echo "  List: $(find public/List -type f 2>/dev/null | wc -l) files"
          echo "  Clash: $(find public/Clash -type f 2>/dev/null | wc -l) files"
          echo "  sing-box: $(find public/sing-box -type f 2>/dev/null | wc -l) files"
          echo "  Loon: $(find public/Loon -type f 2>/dev/null | wc -l) files"

          echo "  GeoIP: $(find public/GeoIP -type f 2>/dev/null | wc -l) files"

          # 模块和脚本
          echo ""
          echo "  Modules (all): $(find public/Modules -type f -name '*.sgmodule' 2>/dev/null | wc -l) files"
          echo "  Modules/Converted: $(find public/Modules/Converted -type f -name '*.sgmodule' 2>/dev/null | wc -l) files"
          echo "  Modules/Merged: $(find public/Modules/Merged -type f -name '*.sgmodule' 2>/dev/null | wc -l) files"
          echo "  Scripts: $(find public/Scripts -type f 2>/dev/null | wc -l) files"

          # 镜像
          echo ""
          echo "  Mirror: $(find public/Mirror -type f 2>/dev/null | wc -l) files"
          echo "    - iRingo: $(find public/Mirror/iRingo -type f 2>/dev/null | wc -l) files"
          echo "    - DualSubs: $(find public/Mirror/DualSubs -type f 2>/dev/null | wc -l) files"
          echo "    - BiliUniverse: $(find public/Mirror/BiliUniverse -type f 2>/dev/null | wc -l) files"
          echo "    - Sukka/mock: $(find public/Mirror/Sukka/mock -type f 2>/dev/null | wc -l) files"
          echo "    - Sukka/sgmodule: $(find public/Mirror/Sukka/sgmodule -type f 2>/dev/null | wc -l) files"

          # 检查 index.html 是否生成
          echo ""
          if [ -f "public/index.html" ]; then
            echo "✅ index.html generated successfully"
            echo "  Size: $(stat -f%z public/index.html 2>/dev/null || stat -c%s public/index.html 2>/dev/null || echo 'unknown') bytes"
            # 检查 index.html 中是否包含关键目录
            echo "  Checking content..."
            for dir in Mirror Modules Scripts List Clash sing-box; do
              if grep -q "$dir" public/index.html; then
                echo "    ✅ Contains $dir"
              else
                echo "    ⚠️  Missing $dir in index.html"
              fi
            done
          else
            echo "❌ index.html not found!"
          fi

          echo ""
          echo "✅ Build output verified"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
          path: ${{ steps.build-dir.outputs.dir }}
          retention-days: 1
          compression-level: 4

      - name: Save cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-build-v3-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }}-${{ github.run_id }}

      - name: Stop browser rule gateway
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/browser-rule-gateway.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Upload browser gateway log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-rule-gateway-log-${{ github.sha }}-${{ github.run_number }}
          path: ${{ runner.temp }}/browser-rule-gateway.log
          retention-days: 7
          if-no-files-found: ignore



  # ============================================
  # PR 差异对比 - 预览构建变更
  # ============================================
  diff-deployment-on-pr:
    name: Diff Build Output
    needs: [prepare, build]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
          path: public

      - name: Compare with production
        run: |
          echo "📥 Downloading production build..."
          git clone --filter=tree:0 --no-tags \
            https://github.com/lucking7/NRRule.git ./deploy-git

          cd ./deploy-git
          echo "📊 Comparing changes..."
          rm -rf ./*
          cp -rf ../public/* ./

          echo ""
          echo "📈 File statistics:"
          git --no-pager diff --stat

          echo ""
          echo "📝 Detailed changes (first 500 lines):"
          git --no-pager diff --minimal | head -500

          echo ""
          echo "✅ Diff complete"

  # ============================================
  # 唯一生产入口：完整 staging tree -> NRRule commit -> 该 commit 的 Cloudflare check
  # -> immutable URL -> 正式域名内容验收 -> acceptance receipt
  # ============================================
  publish:
    name: Publish to Production
    needs: [prepare, baseline, build]
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.deploy_target == 'production' &&
      needs.baseline.result == 'success' &&
      (
        (contains(fromJSON(needs.prepare.outputs.tasks), 'deploy') && needs.build.result == 'success') ||
        (contains(fromJSON(needs.prepare.outputs.tasks), 'rollback') && needs.build.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 生产锁：排队而不取消，已 push 的 commit 一定完成验收。
    concurrency:
      group: nrrule-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      actions: read
    outputs:
      deploy_commit: ${{ steps.push.outputs.deploy_commit }}
      outcome: ${{ steps.verify.outputs.outcome }}
    steps:
      # 没有已验收基线时：自动 run 明确跳过发布；手动 dispatch 直接失败。不回退到 NRRule HEAD。
      - name: Check publication prerequisites
        id: gate
        run: |
          set -euo pipefail
          if [ "$BASELINE_AVAILABLE" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::No accepted baseline receipt; run the bootstrap-baseline task before deploy or rollback" >&2
            exit 1
          fi
          echo "::warning::publication skipped: bootstrap required (no accepted baseline receipt; run the bootstrap-baseline task)"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
        env:
          BASELINE_AVAILABLE: ${{ needs.baseline.outputs.available }}
          EVENT_NAME: ${{ github.event_name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.proceed == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.proceed == 'true'

      - name: Download build artifact
        if: |
          steps.gate.outputs.proceed == 'true' &&
          contains(fromJSON(needs.prepare.outputs.tasks), 'deploy')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact-${{ github.sha }}-${{ github.run_number }}
          path: ${{ runner.temp }}/candidate

      - name: Resolve accepted baseline inside the production lock
        id: baseline
        if: steps.gate.outputs.proceed == 'true'
        run: |
          pnpm run node Build/prepare-publication.ts resolve-baseline \
            --tree "$RUNNER_TEMP/publication-baseline" \
            --evidence "$RUNNER_TEMP/publication-baseline.json" \
            --expected-receipt-id "$EXPECTED_RECEIPT_ID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RECEIPT_ID: ${{ needs.baseline.outputs.receipt_id }}

      - name: Resolve rollback candidate
        if: |
          steps.gate.outputs.proceed == 'true' &&
          contains(fromJSON(needs.prepare.outputs.tasks), 'rollback')
        run: |
          set -euo pipefail
          if ! [[ "$ROLLBACK_RECEIPT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::rollback requires rollback_receipt_id (an accepted MirrRule deployment id)" >&2
            exit 1
          fi
          pnpm run node Build/prepare-publication.ts resolve-baseline \
            --receipt-id "$ROLLBACK_RECEIPT_ID" \
            --tree "$RUNNER_TEMP/candidate" \
            --evidence "$RUNNER_TEMP/rollback-evidence.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK_RECEIPT_ID: ${{ github.event.inputs.rollback_receipt_id }}

      - name: Stage complete publication tree
        id: stage
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          args=(stage
            --candidate "$RUNNER_TEMP/candidate"
            --out "$RUNNER_TEMP/staging"
            --tasks "$TASKS"
            --source-commit "$GITHUB_SHA"
            --tree "$RUNNER_TEMP/publication-baseline"
            --evidence "$RUNNER_TEMP/publication-baseline.json"
            --check-superseded)
          if [ "$IS_ROLLBACK" = "true" ]; then
            args+=(--rollback-evidence "$RUNNER_TEMP/rollback-evidence.json")
          fi
          pnpm run node Build/prepare-publication.ts "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASKS: ${{ needs.prepare.outputs.tasks }}
          IS_ROLLBACK: ${{ contains(fromJSON(needs.prepare.outputs.tasks), 'rollback') }}

      - name: Unarchive NRRule
        if: steps.stage.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          if [ "$(gh repo view lucking7/NRRule --json isArchived --jq .isArchived)" = "true" ]; then
            gh repo unarchive lucking7/NRRule --yes
          fi
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Clone NRRule and record remote HEAD
        id: clone
        if: steps.stage.outputs.superseded == 'false'
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --no-checkout --no-tags \
            "https://${GH_USER}:${GH_TOKEN}@github.com/lucking7/NRRule.git" \
            "$RUNNER_TEMP/deploy-git"
          git -C "$RUNNER_TEMP/deploy-git" config user.email "${GH_EMAIL}"
          git -C "$RUNNER_TEMP/deploy-git" config user.name "${GH_USER}"
          remote_head=$(git -C "$RUNNER_TEMP/deploy-git" rev-parse HEAD)
          echo "Accepted baseline deployCommit: ${{ steps.baseline.outputs.deploy_commit }} (receipt ${{ steps.baseline.outputs.receipt_id }})"
          echo "NRRule remote HEAD (may include an unaccepted candidate): $remote_head"
          echo "expected_head=$remote_head" >> "$GITHUB_OUTPUT"
        env:
          GH_EMAIL: ${{ secrets.GIT_EMAIL }}
          GH_USER: ${{ secrets.GIT_USER }}
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Commit and push NRRule
        id: push
        if: steps.stage.outputs.superseded == 'false'
        run: |
          pnpm run node Build/prepare-publication.ts push \
            --repo "$RUNNER_TEMP/deploy-git" \
            --staging "$RUNNER_TEMP/staging" \
            --branch main \
            --expected-head "$EXPECTED_HEAD" \
            --message "deploy: ${{ github.repository }}@${{ github.sha }} [$SCOPES]"
        env:
          EXPECTED_HEAD: ${{ steps.clone.outputs.expected_head }}
          SCOPES: ${{ steps.stage.outputs.scopes }}

      - name: Verify Cloudflare deployment and production content
        id: verify
        if: steps.push.outputs.deploy_commit != ''
        run: |
          pnpm run node Build/verify-publication.ts verify \
            --deploy-commit "$DEPLOY_COMMIT" \
            --staging "$RUNNER_TEMP/staging" \
            --timeout-minutes 15 \
            --report "$RUNNER_TEMP/publication-evidence/verification.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMIT: ${{ steps.push.outputs.deploy_commit }}

      - name: Record acceptance receipt
        if: steps.verify.outputs.outcome == 'accepted'
        run: |
          pnpm run node Build/verify-publication.ts record-receipt \
            --kind manifest \
            --staging "$RUNNER_TEMP/staging" \
            --deploy-commit "$DEPLOY_COMMIT" \
            --immutable-url "$IMMUTABLE_URL" \
            --ref "$GITHUB_SHA" \
            --log-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMMIT: ${{ steps.push.outputs.deploy_commit }}
          IMMUTABLE_URL: ${{ steps.verify.outputs.immutable_url }}

      - name: Collect publication evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/publication-evidence"
          if [ -f "$RUNNER_TEMP/staging/Internal/publication-manifest.json" ]; then
            cp "$RUNNER_TEMP/staging/Internal/publication-manifest.json" "$RUNNER_TEMP/publication-evidence/"
          fi
          if [ -f "$RUNNER_TEMP/publication-baseline.json" ]; then
            cp "$RUNNER_TEMP/publication-baseline.json" "$RUNNER_TEMP/publication-evidence/"
          fi
          echo "NRRule deployCommit: ${DEPLOY_COMMIT:-none}; verification outcome: ${OUTCOME:-not run}"
        env:
          DEPLOY_COMMIT: ${{ steps.push.outputs.deploy_commit }}
          OUTCOME: ${{ steps.verify.outputs.outcome }}

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-evidence-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-evidence
          retention-days: 30
          if-no-files-found: ignore

      - name: Archive NRRule
        if: always() && steps.stage.outputs.superseded == 'false'
        run: |
          rm -rf "$RUNNER_TEMP/deploy-git"
          if ! gh repo archive lucking7/NRRule --yes; then
            echo "::warning::NRRule could not be re-archived; archive it manually"
          fi
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}

  # ============================================
  # 首次迁移：核验固定的旧版 NRRule revision，写入 legacy-bootstrap receipt（不发布）
  # ============================================
  bootstrap-baseline:
    name: Bootstrap Legacy Baseline
    needs: prepare
    if: |
      contains(fromJSON(needs.prepare.outputs.tasks), 'bootstrap-baseline') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nrrule-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Verify pinned legacy revision
        id: verify
        run: |
          set -euo pipefail
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::bootstrap_revision must be a full 40-character NRRule commit SHA" >&2
            exit 1
          fi
          pnpm run node Build/prepare-publication.ts bootstrap \
            --tree "$RUNNER_TEMP/legacy-tree" \
            --revision "$REVISION" \
            --immutable-url "$IMMUTABLE_URL" \
            --out "$RUNNER_TEMP/bootstrap"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.event.inputs.bootstrap_revision }}
          IMMUTABLE_URL: ${{ github.event.inputs.bootstrap_immutable_url }}

      - name: Upload legacy inventory
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-bootstrap-${{ github.event.inputs.bootstrap_revision }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bootstrap
          retention-days: 90
          if-no-files-found: error

      - name: Record legacy-bootstrap receipt
        run: |
          pnpm run node Build/verify-publication.ts record-receipt \
            --kind legacy-bootstrap \
            --inventory "$RUNNER_TEMP/bootstrap/legacy-inventory.json" \
            --deploy-commit "$REVISION" \
            --immutable-url "$IMMUTABLE_URL" \
            --source-commit "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --ref "$GITHUB_SHA" \
            --log-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.event.inputs.bootstrap_revision }}
          IMMUTABLE_URL: ${{ steps.verify.outputs.immutable_url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}

      - name: Upload failed bootstrap evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-bootstrap-failure-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bootstrap
          retention-days: 30
          if-no-files-found: ignore
