name: Check Source Health

on:
  # Manual only: run it to check that configured upstreams are still reachable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check configured upstreams
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check sources
        id: health
        continue-on-error: true
        run: pnpm run node Build/validate-domain-alive.ts source-health-report.json
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-health-report
          path: source-health-report.json
          retention-days: 14
      - name: Propagate health result
        if: steps.health.outcome == 'failure'
        run: exit 1
