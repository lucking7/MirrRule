name: Check Source Health

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-health-state
  cancel-in-progress: false

jobs:
  check:
    name: Check configured upstreams
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install browser gateway dependencies
        run: python3 -m pip install --requirement Build/browser-rule-requirements.txt
      - name: Run browser gateway tests
        run: python3 Build/__tests__/browser-rule-gateway.test.py
      - name: Start browser rule gateway
        run: |
          set -euo pipefail
          gateway_log="$RUNNER_TEMP/browser-rule-gateway.log"
          gateway_pid="$RUNNER_TEMP/browser-rule-gateway.pid"
          nohup python3 Build/browser-rule-gateway.py \
            --upstream-base https://cloudflare-proxy.lucking.workers.dev \
            --port 13193 >"$gateway_log" 2>&1 &
          gateway_pid_value=$!
          printf '%s\n' "$gateway_pid_value" > "$gateway_pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:13193/health >/dev/null; then
              echo "✅ Browser rule gateway ready (attempt $attempt/30)"
              exit 0
            fi
            if ! kill -0 "$gateway_pid_value" 2>/dev/null; then
              echo "❌ Browser rule gateway exited during startup" >&2
              cat "$gateway_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "❌ Browser rule gateway startup timed out" >&2
          cat "$gateway_log" >&2 || true
          exit 1
      - run: pnpm install --frozen-lockfile
      - name: Check sources
        id: health
        continue-on-error: true
        run: pnpm run node Build/validate-domain-alive.ts source-health-report.json
        env:
          # Mirror the build's fetch path through the local browser gateway and
          # its configured Worker upstream.
          PROXY_BASE: http://127.0.0.1:13193?url=
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-health-report
          path: source-health-report.json
          retention-days: 14
      - name: Load durable state
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-health-state-data
          if git ls-remote --exit-code --heads origin source-health-state >/dev/null; then
            git fetch --no-tags origin source-health-state
            git show FETCH_HEAD:state.json > source-health-state-data/state.json
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            printf '{"sources":{}}\n' > source-health-state-data/state.json
          fi
      - name: Apply three-strike state machine
        if: github.event_name == 'schedule'
        run: pnpm run node Build/update-source-health-state.ts source-health-report.json source-health-state-data/state.json source-health-state-data/actions.json
      - name: Manage health issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label='source-health'
          title='Automated upstream source health'
          gh label create "$label" --color D93F0B --description 'Automated structured source health alert' --force
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          unhealthy=$(jq -r '[.sources[] | select(.deadStreak >= 3) | .id] | sort | .[]' source-health-state-data/state.json)
          if [ -n "$unhealthy" ]; then
            body=$(printf 'The following configured sources have failed at least three consecutive scheduled checks:\n\n%s\n\nLatest report is attached to this workflow run.' "$(printf '%s\n' "$unhealthy" | sed 's/^/- `/;s/$/`/')")
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --title "$title" --body "$body"
              gh issue comment "$issue" --body "Updated after scheduled check at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            else
              gh issue create --label "$label" --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "No currently configured sources remain above the alert threshold after reconciliation at $(date -u +'%Y-%m-%dT%H:%M:%SZ'); prior alerts have recovered or their sources were retired."
            gh issue close "$issue"
          fi
      - name: Persist durable state branch
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp source-health-state-data/state.json "$tmp/state.json"
          cd "$tmp"
          git init
          git checkout --orphan source-health-state
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state.json
          git commit -m 'chore: update source health state'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin source-health-state
      - name: Propagate health result
        if: steps.health.outcome == 'failure'
        run: exit 1
      - name: Stop browser rule gateway
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/browser-rule-gateway.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi
      - name: Upload browser gateway log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-rule-gateway-log-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-rule-gateway.log
          retention-days: 7
          if-no-files-found: ignore
